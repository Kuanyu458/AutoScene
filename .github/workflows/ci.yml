name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run lint smoke checks
        run: |
          python -m py_compile tools/base_tool.py
          python -m py_compile tools/tool_registry.py
          python -m py_compile tools/cost_tracker.py
          python -m py_compile tools/analysis/composition_validator.py

      - name: Run test suite
        run: python -m pytest tests/ -v

  openmontage-video-contract:
    name: Validate openmontage-video skill and lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: tools/capture/playwright_runtime/package-lock.json

      - name: Install pinned Playwright runtime
        working-directory: tools/capture/playwright_runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install deterministic audio dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-openmontage-video.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate skill, pipeline, schemas, and licenses
        env:
          PYTHONUTF8: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python .agents/skills/openmontage-video/scripts/validate-job.py --help
          python -c "from pathlib import Path; p=Path('.agents/skills/openmontage-video/SKILL.md'); t=p.read_text(encoding='utf-8'); assert t.startswith('---') and 'name: openmontage-video' in t and 'description:' in t"
          python scripts/license_scan.py --check
          node --check tools/capture/playwright_runtime/runner.mjs
          python -m pytest -q tests/contracts/test_openmontage_video_contract.py tests/tools/test_openmontage_video_tools.py

      - name: Install Chromium for localhost smoke tests
        working-directory: tools/capture/playwright_runtime
        run: npx playwright install --with-deps chromium

      - name: Run localhost browser smoke test
        env:
          PYTHONUTF8: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          OPENMONTAGE_VIDEO_E2E: "1"
        run: python -m pytest -q tests/tools/test_openmontage_video_e2e.py
