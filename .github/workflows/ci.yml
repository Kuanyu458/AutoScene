name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install locked runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix remotion-composer --no-audit --no-fund

      - name: Verify installation
        run: |
          python -m pip check
          python -m openmontage doctor --json
          python scripts/check_public_tree.py --json

      - name: Run complete test suite
        run: python -m pytest -q -rs

  composer:
    name: Remotion composer / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install Node lockfile
        run: npm ci --prefix remotion-composer --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck --prefix remotion-composer

      - name: Audit production dependencies
        run: npm audit --prefix remotion-composer --omit=dev --audit-level=high

      - name: Load Remotion compositions
        working-directory: remotion-composer
        run: npx remotion compositions src/index.tsx

  windows-contract:
    name: Portable contract / Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress

      - name: Install locked runtimes
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix remotion-composer --no-audit --no-fund

      - name: Verify portable contracts
        shell: pwsh
        run: |
          python -m pip check
          python -m openmontage doctor --json
          python -m pytest -q tests/contracts/test_montage_request.py tests/contracts/test_edit_timeline_v2.py tests/contracts/test_public_distribution.py tests/contracts/test_recordly_screen_demo_contract.py tests/tools/test_remotion_three_scene.py tests/tools/test_screen_capture_selector.py tests/tools/test_recordly_recorder.py tests/e2e/test_recordly_capture_ingest.py
